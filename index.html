<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 시계 읽기 학습</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .btn-diff {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-diff.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: bold;
    }

    .clock-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 20px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .input-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    input[type="number"] {
      width: 65px;
      height: 48px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    .unit-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .feedback {
      margin-top: 16px;
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .feedback.correct {
      color: var(--accent-green);
    }

    .feedback.wrong {
      color: var(--accent-red);
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: bold;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⏰ 시계 읽기 퀴즈</h1>

    <div class="controls">
      <button class="btn-diff active" onclick="setDifficulty('easy')">쉬움 (정각/30분)</button>
      <button class="btn-diff" onclick="setDifficulty('medium')">보통 (5분 단위)</button>
      <button class="btn-diff" onclick="setDifficulty('hard')">어려움 (1분 단위)</button>
      <button class="btn-diff" onclick="setDifficulty('sec')">초 포함</button>
    </div>

    <div class="clock-wrapper">
      <canvas id="clock" width="320" height="320"></canvas>
    </div>

    <div class="input-section">
      <div class="input-group">
        <input type="number" id="ansHour" min="1" max="12" placeholder="시">
        <span class="unit-text">시</span>
      </div>
      <div class="input-group">
        <input type="number" id="ansMin" min="0" max="59" placeholder="분">
        <span class="unit-text">분</span>
      </div>
      <div class="input-group" id="secGroup" style="display: none;">
        <input type="number" id="ansSec" min="0" max="59" placeholder="초">
        <span class="unit-text">초</span>
      </div>
    </div>

    <button class="btn-submit" onclick="checkAnswer()">정답 확인</button>

    <div class="feedback" id="feedback"></div>

    <div class="stats">
      <div>연속 정답: <span id="streak" class="stat-val">0</span>회</div>
      <div>맞힌 개수: <span id="score" class="stat-val">0</span>개</div>
    </div>
  </div>

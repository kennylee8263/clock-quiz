<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 시계 읽기 학습</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .btn-diff {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-diff.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: bold;
    }

    .clock-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 20px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .input-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    input[type="number"] {
      width: 65px;
      height: 48px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    .unit-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .feedback {
      margin-top: 16px;
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .feedback.correct {
      color: var(--accent-green);
    }

    .feedback.wrong {
      color: var(--accent-red);
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: bold;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⏰ 시계 읽기 퀴즈</h1>

    <div class="controls">
      <button class="btn-diff active" onclick="setDifficulty('easy')">쉬움 (정각/30분)</button>
      <button class="btn-diff" onclick="setDifficulty('medium')">보통 (5분 단위)</button>
      <button class="btn-diff" onclick="setDifficulty('hard')">어려움 (1분 단위)</button>
      <button class="btn-diff" onclick="setDifficulty('sec')">초 포함</button>
    </div>

    <div class="clock-wrapper">
      <canvas id="clock" width="320" height="320"></canvas>
    </div>

    <div class="input-section">
      <div class="input-group">
        <input type="number" id="ansHour" min="1" max="12" placeholder="시">
        <span class="unit-text">시</span>
      </div>
      <div class="input-group">
        <input type="number" id="ansMin" min="0" max="59" placeholder="분">
        <span class="unit-text">분</span>
      </div>
      <div class="input-group" id="secGroup" style="display: none;">
        <input type="number" id="ansSec" min="0" max="59" placeholder="초">
        <span class="unit-text">초</span>
      </div>
    </div>

    <button class="btn-submit" onclick="checkAnswer()">정답 확인</button>

    <div class="feedback" id="feedback"></div>

    <div class="stats">
      <div>연속 정답: <span id="streak" class="stat-val">0</span>회</div>
      <div>맞힌 개수: <span id="score" class="stat-val">0</span>개</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('clock');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;

    let targetHour = 0;
    let targetMin = 0;
    let targetSec = 0;
    let difficulty = 'easy';
    let score = 0;
    let streak = 0;

    function getKoreanTimeString(h, m, s) {
      const pureKoreanHours = ["", "한", "두", "세", "네", "다섯", "여섯", "일곱", "여덟", "아홉", "열", "열한", "열두"];
      let str = `${pureKoreanHours[h]} 시`;
      if (m > 0) {
        str += ` ${m} 분`;
      }
      if (difficulty === 'sec' && s > 0) {
        str += ` ${s} 초`;
      }
      return str + "입니다.";
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function setDifficulty(diff) {
      difficulty = diff;
      document.querySelectorAll('.btn-diff').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      const secGroup = document.getElementById('secGroup');
      secGroup.style.display = (diff === 'sec') ? 'flex' : 'none';

      generateNewQuestion();
    }

    function generateNewQuestion() {
      targetHour = Math.floor(Math.random() * 12) + 1;

      if (difficulty === 'easy') {
        targetMin = Math.random() < 0.5 ? 0 : 30;
        targetSec = 0;
      } else if (difficulty === 'medium') {
        targetMin = Math.floor(Math.random() * 12) * 5;
        targetSec = 0;
      } else if (difficulty === 'hard') {
        targetMin = Math.floor(Math.random() * 60);
        targetSec = 0;
      } else if (difficulty === 'sec') {
        targetMin = Math.floor(Math.random() * 60);
        targetSec = Math.floor(Math.random() * 60);
      }

      document.getElementById('ansHour').value = '';
      document.getElementById('ansMin').value = '';
      document.getElementById('ansSec').value = '';
      document.getElementById('feedback').innerText = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('ansHour').focus();

      drawClock();
    }

    function drawClock() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(radius, radius);

      // 시계 배경 테두리
      ctx.beginPath();
      ctx.arc(0, 0, radius - 12, 0, 2 * Math.PI);
      ctx.fillStyle = 'white';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#374151';
      ctx.stroke();

      // 1. [분 숫자 표기] (00, 05, 10, ... 55) - 시계 바깥 테두리 부근
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.font = "bold 13px sans-serif";
      ctx.fillStyle = "#2563eb"; // 구분하기 쉽도록 파란색으로 표현

      for (let num = 0; num < 12; num++) {
        let minVal = num * 5;
        let minStr = minVal < 10 ? '0' + minVal : minVal.toString();
        let ang = num * Math.PI / 6;
        
        ctx.rotate(ang);
        ctx.translate(0, -radius + 24);
        ctx.rotate(-ang);
        ctx.fillText(minStr, 0, 0);
        ctx.rotate(ang);
        ctx.translate(0, radius - 24);
        ctx.rotate(-ang);
      }

      // 2. [시 숫자 표기] (1 ~ 12) - 크고 선명하게 표시
      ctx.font = "bold 26px sans-serif";
      ctx.fillStyle = "#111827";

      for (let num = 1; num <= 12; num++) {
        let ang = num * Math.PI / 6;
        ctx.rotate(ang);
        ctx.translate(0, -radius + 54);
        ctx.rotate(-ang);
        ctx.fillText(num.toString(), 0, 0);
        ctx.rotate(ang);
        ctx.translate(0, radius - 54);
        ctx.rotate(-ang);
      }

      // 3. 작은 눈금 (60개)
      for (let i = 0; i < 60; i++) {
        let ang = i * Math.PI / 30;
        ctx.beginPath();
        ctx.lineWidth = i % 5 === 0 ? 3 : 1;
        ctx.strokeStyle = i % 5 === 0 ? "#374151" : "#d1d5db";
        let startR = radius - 35;
        let endR = i % 5 === 0 ? radius - 42 : radius - 39;
        ctx.moveTo(startR * Math.sin(ang), -startR * Math.cos(ang));
        ctx.lineTo(endR * Math.sin(ang), -endR * Math.cos(ang));
        ctx.stroke();
      }

      // 시/분/초 각도 계산
      let secRad = (targetSec * Math.PI / 30);
      let minRad = (targetMin * Math.PI / 30) + (secRad / 60);
      let hourRad = ((targetHour % 12) * Math.PI / 6) + (minRad / 12);

      // 시침 (두껍고 짧음)
      drawHand(hourRad, radius * 0.42, 8, "#111827");

      // 분침 (길고 파란색 포인트)
      drawHand(minRad, radius * 0.62, 5, "#2563eb");

      // 초침 (빨간색)
      if (difficulty === 'sec') {
        drawHand(secRad, radius * 0.72, 2, "#ef4444");
      }

      // 중앙 고정점
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, 2 * Math.PI);
      ctx.fillStyle = "#ef4444";
      ctx.fill();

      ctx.restore();
    }

    function drawHand(pos, length, width, color) {
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.moveTo(0, 0);
      ctx.rotate(pos);
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.rotate(-pos);
    }

    function checkAnswer() {
      const userHour = parseInt(document.getElementById('ansHour').value);
      const userMin = parseInt(document.getElementById('ansMin').value) || 0;
      const userSec = parseInt(document.getElementById('ansSec').value) || 0;

      if (isNaN(userHour)) {
        alert("시간을 입력해주세요!");
        return;
      }

      const feedbackEl = document.getElementById('feedback');
      const timeSpeech = getKoreanTimeString(targetHour, targetMin, targetSec);

      const isHourCorrect = (userHour % 12) === (targetHour % 12);
      const isMinCorrect = userMin === targetMin;
      const isSecCorrect = (difficulty !== 'sec') || (userSec === targetSec);

      if (isHourCorrect && isMinCorrect && isSecCorrect) {
        feedbackEl.innerText = `⭕ 정답입니다! (${timeSpeech})`;
        feedbackEl.className = 'feedback correct';
        score++;
        streak++;
        speakText(`정답입니다. ${timeSpeech}`);
        setTimeout(generateNewQuestion, 2000);
      } else {
        feedbackEl.innerText = `❌ 틀렸습니다. 다시 시도해보세요!`;
        feedbackEl.className = 'feedback wrong';
        streak = 0;
        speakText("틀렸습니다. 다시 시도해보세요.");
      }

      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;
    }

    document.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    generateNewQuestion();
  </script>
</body>
</html>
